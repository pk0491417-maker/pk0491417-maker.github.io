<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora Play</title>
  <meta name="description" content="Nexora Play - Gaming App & Website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080b16;
      color: white;
    }

    header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111629;
      border-bottom: 1px solid #252b45;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: #6c63ff;
    }

    .install {
      background: #6c63ff;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #6c63ff;
    }

    .hero p {
      color: #b7bdd3;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .start {
      display: inline-block;
      background: #6c63ff;
      color: white;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-weight: bold;
    }

    .games {
      padding: 25px 20px 60px;
      max-width: 900px;
      margin: auto;
    }

    .games h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: #111629;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #252b45;
      text-align: center;
    }

    .card .icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #aeb5ca;
      margin-bottom: 18px;
    }

    .play {
      border: 0;
      background: #252b45;
      color: white;
      padding: 10px 20px;
      border-radius: 9px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #858ca5;
      border-top: 1px solid #252b45;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Nexora <span>Play</span></div>
    <button class="install" onclick="installApp()">Install App</button>
  </header>

  <section class="hero">
    <h1>Welcome to <span>Nexora Play</span></h1>
    <p>
      Your gaming world starts here.<br>
      Play exciting games and explore Nexora.
    </p>
    <a href="#games" class="start">Explore Games</a>
  </section>

  <section class="games" id="games">
    <h2>🎮 Games</h2>

    <div class="cards">

      <div class="card">
        <div class="icon">💣</div>
        <h3>Mines</h3>
        <p>Classic mines-style demo game.</p>
        <button class="play" onclick="demo('Mines')">Play</button>
      </div>

      <div class="card">
        <div class="icon">🪙</div>
        <h3>Coin Flip</h3>
        <p>Try your luck with a coin flip.</p>
        <button class="play" onclick="demo('Coin Flip')">Play</button>
      </div>

      <div class="card">
        <div class="icon">🎯</div>
        <h3>Lucky Target</h3>
        <p>Simple target game demo.</p>
        <button class="play" onclick="demo('Lucky Target')">Play</button>
      </div>

    </div>
  </section>

  <footer>
    © 2026 Nexora Play
  </footer>

  <script>
    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
    });

    async function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      } else {
        alert("Install option browser ke menu me available ho sakta hai.");
      }
    }

    function demo(game) {
      alert(game + " demo opening soon!");
    }
  </script>

</body>
</html>
